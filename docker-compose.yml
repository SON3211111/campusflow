services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - API_TARGET=http://backend:8080
      - AI_TARGET=${AI_TARGET:-http://ai:8000}
    env_file:
      - .env
    networks:
      - campusflow-net
    profiles:
      - main
      - frontend

  backend:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - gradle_cache:/root/.gradle
      - ./uploads:/app/uploads
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/campusflow?serverTimezone=Asia/Seoul
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - JWT_SECRET=campusflowSecretKeySuccessServiceSuccess2026ProjectTopSecurity
      - AI_SERVER_URL=${AI_SERVER_URL:-http://ai:8000}
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - campusflow-net
    profiles:
      - main
      - backend

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campusflow-net
    profiles:
      - main
      - backend

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - campusflow-net
    restart: unless-stopped
    profiles:
      - ai
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ai:
    build:
      context: ./ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - ollama
    volumes:
      - ./ai:/app
    networks:
      - campusflow-net
    restart: unless-stopped
    profiles:
      - ai

volumes:
  mysql_data:
  gradle_cache:
  ollama_data:

networks:
  campusflow-net:
