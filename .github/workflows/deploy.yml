name: CampusFlow CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # main 브랜치에 푸시되면 자동으로 배포 발동!

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 백엔드 빌드를 위한 자바 환경 구성
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 스프링 부트 그레이들 빌드 (jar 파일 생성)
      - name: Build Backend with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      # 4. Docker Hub 원격 저장소 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 프론트엔드 및 백엔드 도커 이미지 빌드 후 Docker Hub에 push
      - name: Build and Push Docker Images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/campusflow-backend:latest ./backend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/campusflow-frontend:latest ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/campusflow-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/campusflow-frontend:latest

      # 6. AWS EC2 운영 서버에 SSH로 접속하여 배포 명령 실행
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            docker compose down
            docker compose pull
            docker compose up -d
            docker image prune -f # 오래된 찌꺼기 이미지 삭제